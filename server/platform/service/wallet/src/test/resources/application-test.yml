spring:
  datasource:
    url: jdbc:h2:mem:wallet_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update

# No moneypot.outbox.client / moneypot.inbox.client here: nothing is published and nothing is consumed from RabbitMQ, so
# the tests feed events to the inbox directly and read the outbox table.
outbox:
  relay:
    enabled: false

wallet:
  deposit:
    enabled: true
