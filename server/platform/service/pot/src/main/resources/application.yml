server:
  port: ${PORT:9082}

spring:
  application:
    name: pot
  profiles:
    # The profile also selects which moneypot-infra-<profile>.yml says where RabbitMQ is.
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    show-sql: false

outbox:
  poll-interval-ms: 1000
  relay:
    batch-size: 50
    lease-seconds: 30

pot:
  start:
    # Closes joining and starts the bidding of every pot whose start time has come.
    enabled: true
    interval-ms: 5000
  settlement:
    enabled: true
    interval-ms: 5000
  websocket:
    # The pages that may open the live connection of a pot (the web app). Comma separated.
    allowed-origins: ${POT_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3100}

moneypot:
  security:
    jwt:
      # Tokens are signed by the identity service; this service only verifies them.
      issuer: ${JWT_ISSUER:moneypot-identity}
