spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/identity_db}
    username: ${SPRING_DATASOURCE_USERNAME:moneypot}
    password: ${SPRING_DATASOURCE_PASSWORD:moneypot}
  jpa:
    hibernate:
      ddl-auto: update

identity:
  jwt:
    # No key is committed: one is generated on first start and kept outside the repository.
    dev-key-file: ${IDENTITY_DEV_KEY_FILE:${user.home}/.moneypot-dev/identity-jwt-private.pem}
  password-reset:
    # No mail sender is wired yet, so the link is logged to let a reset be tried by hand. Never enable this elsewhere.
    log-links: true
